<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Beauty — Резервация</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="has-nav">
<nav class="site-nav">
  <a href="index.html">Начало</a>
  <a href="procedures.html">Процедури</a>
  <a href="flagship.html">Хидродинамика</a>
  <a href="about.html">За мен</a>
  <a href="booking.html" class="nav-cta active">Резервация</a>
</nav>

<div style="display:flex; justify-content:center; padding:24px 20px 60px;">
  <main class="card">
    <h1>Pure Beauty</h1>
    <p class="subtitle">Massage • Body Recovery • Therapy</p>

    <form id="booking-form">
      <label for="name">Име</label>
      <input type="text" id="name" name="name" required autocomplete="name">

      <label for="phone">Телефон</label>
      <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="+359...">

      <label for="service">Услуга</label>
      <select id="service" name="service" required>
        <option value="" disabled selected>Избери услуга</option>
        <optgroup label="Авторски масаж">
          <option value="avtorski_60">Цяло тяло, 60 мин — 50€</option>
          <option value="avtorski_90">Цяло тяло, 90 мин — 60€</option>
          <option value="avtorski_back">Гръб, 30 мин — 25€</option>
          <option value="avtorski_legs">Крака, 40 мин — 30€</option>
          <option value="avtorski_arms">Ръце, 30 мин — 25€</option>
          <option value="avtorski_neck">Шийно-яketна зона, 30 мин — 25€</option>
          <option value="avtorski_package">Пакет 4+1 (60 мин сеанс)</option>
        </optgroup>
        <optgroup label="Миофасциален масаж">
          <option value="myo_60">Цяло тяло, 60 мин — 50€</option>
          <option value="myo_90">Цяло тяло, 90 мин — 60€</option>
          <option value="myo_back">Гръб, 30 мин — 25€</option>
          <option value="myo_legs">Крака, 40 мин — 30€</option>
          <option value="myo_arms">Ръце, 30 мин — 25€</option>
          <option value="myo_neck">Шийно-яketна зона, 30 мин — 25€</option>
          <option value="myo_package">Пакет 4+1 (60 мин сеанс)</option>
        </optgroup>
        <optgroup label="Дълбока вибрация (HIVAMAT)">
          <option value="vibration">Една програма, 15 мин — 15€</option>
          <option value="vibration_package">Пакет 4+1</option>
        </optgroup>
        <optgroup label="Smart RF">
          <option value="smartrf">Обща процедура, 60 мин — 60€</option>
          <option value="smartrf_package">Пакет 4+1</option>
        </optgroup>
        <optgroup label="Друго">
          <option value="consult">Консултация, 20 мин</option>
        </optgroup>
      </select>

      <label for="date">Дата</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Час</label>
      <input type="time" id="time" name="time" required min="09:00" max="18:30" step="1800">

      <button type="submit" id="submit-btn">Резервирай</button>
    </form>

    <p id="status" role="status"></p>
  </main>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
